# ── Font ─────────────────────────────────────────────────────────────────
# Installed by bootstrap.sh stage 11 (ryanoasis/nerd-fonts release).
# kitty spaces the Nerd Font symbol glyphs itself, so use the plain
# "Nerd Font" build here, not "Nerd Font Mono".
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Appearance ───────────────────────────────────────────────────────────
# Catppuccin Mocha (official theme, upstream: catppuccin/kitty).
# Path is relative to this file.
include catppuccin-mocha.conf

dynamic_background_opacity yes
background_opacity         0.8
